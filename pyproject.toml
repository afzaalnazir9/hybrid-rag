[project]
name = "hybrid-rag"
version = "0.1.0"
description = "A small hybrid RAG app: semantic + BM25 search, RRF fusion, reranking, and cited answers from Claude."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.0",
    "qdrant-client[fastembed]>=1.14",
    "pydantic-settings>=2.6",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "streamlit>=1.40",
    "ollama>=0.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: uses the real local models (downloads ~200 MB on first run)"]
